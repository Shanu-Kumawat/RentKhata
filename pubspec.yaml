name: rent_khata
description: "Offline-first rental management app for Indian landlords."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Data Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Image handling
  image_picker: ^1.1.2

  # QR & Sharing
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.3

  # Backup
  archive: ^4.0.4

  # Utilities
  intl: ^0.20.2

  # Security
  local_auth: ^2.3.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  shared_preferences: ^2.5.5
  open_file: ^3.5.11
  file_picker: ^10.3.10
  flutter_animate: ^4.5.2
  package_info_plus: ^9.0.1
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_analytics: ^12.4.3
  in_app_review: ^2.0.12
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  drift_dev: ^2.23.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo/logo_primary_with_bg.png"
  adaptive_icon_background: "#3580ff"
  adaptive_icon_foreground: "assets/logo/logo_transparent.png"

flutter_native_splash:
  color: "#3580ff"
  image: "assets/logo/splash_icon_transparent.png"
  android: true
  ios: false
  android_12:
    image: "assets/logo/splash_icon_transparent.png"
    icon_background_color: "#3580ff"
    color: "#3580ff"
